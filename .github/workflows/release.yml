# 打 tag（v0.1.0 这种）或手动触发时，同时在 Windows 与 macOS 上出安装包。
# 打 tag 时每个平台的 job 直接把自己的产物挂到同名 GitHub Release（几个 job 各自追加）。
# 版本号带「-」的（v0.2.0-beta.1）标成预发布：正式版用户的检查更新只看 releases/latest，收不到测试版。
# 词典数据库不入库：先从草稿 Release「build-data」取（scripts/release/fetch-data.mjs）。
# Release 的说明从中英两份更新日志里摘（scripts/release-notes.mjs），每个 job 写的都一样。做法同千语集。
name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            # latest.yml 与 .blockmap 给应用内的增量更新用：少了就让这一步失败，免得悄悄只剩整包下载
            files: |
              dist/*-setup.exe
              dist/*-setup.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            artifact: macos
            files: |
              dist/*-mac-x64.dmg
              dist/*-mac-arm64.dmg
    runs-on: ${{ matrix.os }}
    env:
      # 没有签名证书：跳过 macOS 签名与公证
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dictionary data
        run: node scripts/release/fetch-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Windows 跟本机一样：pack-win.sh 拼出免安装版，再用 --prepackaged 打 NSIS 安装包
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash scripts/pack-win.sh
          npx electron-builder --win nsis --prepackaged dist/win-unpacked --publish never
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          npx electron-vite build
          npx electron-builder --mac --publish never
      # 核对打出来的程序：词典数据、程序包名（决定数据目录）、更新仓库、麦克风用途说明，缺了就失败
      - name: Check package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -la dist/win-unpacked/resources/data/ja
          test -s dist/win-unpacked/resources/data/ja/dict.sqlite
          test -s dist/win-unpacked/resources/data/ja/wikt.sqlite
          node -e "const p=JSON.parse(require('@electron/asar').extractFile('dist/win-unpacked/resources/app.asar','package.json'));console.log(p.name,p.version);if(p.name!=='qonsona')process.exit(1)"
          cat dist/win-unpacked/resources/app-update.yml
          grep -q '^repo: Qonsona' dist/win-unpacked/resources/app-update.yml
          cat dist/latest.yml
      - name: Check package (macOS)
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac/Qonsona.app dist/mac-arm64/Qonsona.app; do
            echo "== $app"
            ls -la "$app/Contents/Resources/data/ja"
            test -s "$app/Contents/Resources/data/ja/dict.sqlite"
            test -s "$app/Contents/Resources/data/ja/wikt.sqlite"
            plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist"
            plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
            node -e "const a=require('@electron/asar'),f=process.argv[1];const p=JSON.parse(a.extractFile(f,'package.json'));const n=a.listPackage(f).filter((x)=>x.includes('kuromoji/dict/')).length;console.log(p.name,p.version,'kuromoji dict files',n);if(p.name!=='qonsona'||!n)process.exit(1)" "$app/Contents/Resources/app.asar"
          done
      - name: List outputs
        shell: bash
        run: ls -la dist | grep -v '^d'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Qonsona ${{ github.ref_name }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
