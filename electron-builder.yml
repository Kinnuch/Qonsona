appId: io.github.kinnuch.qonsona
productName: Qonsona
copyright: Copyright © 2026 Kinnuch · MIT
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!docs/*'
  - '!dist/*'
  - '!scripts/*'
  - '!.github/*'
  - '!.cache/*'
  # data/ 里的 JSON 构建时已经打进主进程；词典数据库在下面的 extraResources 里，放在 asar 外面
  - '!data/*'
  - '!resources/data/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,CHANGELOG.md,README.md,dev.cmd}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# 词典数据库（npm run data:ja、wiktionary-ja.mjs 生成）：SQLite 读不了 asar 里的文件，
# 打包后在 process.resourcesPath/data/ja/（src/main/index.ts 的 jaDictPath）
extraResources:
  - from: resources/data
    to: data

# ── 自动更新的元数据 ──
# 只用来生成 latest.yml、安装包的 .blockmap（应用内增量更新靠它们）；打包都带 --publish never，
# 上传由 .github/workflows/release.yml 做。改仓库名时跟 src/main/update.ts、scripts/pack-win.sh 写的
# app-update.yml 一起改
publish:
  provider: github
  owner: Kinnuch
  repo: Qonsona
  releaseType: release

# ── Windows ──
# 打包走 scripts/pack-win.sh + --prepackaged（见 package.json 的 installer:win；本机与 CI 一样）
win:
  executableName: Qonsona
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: Qonsona-${version}-setup.${ext}
  shortcutName: Qonsona
  uninstallDisplayName: Qonsona
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

# ── macOS ──
# 不签名、不公证（没有 Apple 开发者账号），做法同千语集：第一次打开要右键「打开」，或者 xattr -cr。
# 录音要用麦克风：Info.plist 里没有用途说明的话，系统会直接结束程序
mac:
  icon: build/icon.png
  category: public.app-category.education
  artifactName: Qonsona-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  notarize: false
  darkModeSupport: true
  extendInfo:
    NSMicrophoneUsageDescription: 'Qonsona uses the microphone to record your pronunciation; recordings stay on this computer. Qonsona 用麦克风录下你的发音，录音只存在本机。'
dmg:
  artifactName: Qonsona-${version}-mac-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

npmRebuild: false
