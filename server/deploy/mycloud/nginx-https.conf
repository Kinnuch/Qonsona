server {
    listen 80;
    listen [::]:80;
    server_name kinnuch.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/qon-account-api; }
    location / { return 308 https://kinnuch.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kinnuch.cn;
    ssl_certificate /etc/letsencrypt/live/kinnuch.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kinnuch.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QonSSL:10m;
    client_max_body_size 40k;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /qon-api/v1/admin/ { return 404; }
    location /qon-api/ {
        proxy_pass http://127.0.0.1:3781/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
